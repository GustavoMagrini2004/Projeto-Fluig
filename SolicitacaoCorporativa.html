<html>

<head>


    <link type="text/css" rel="stylesheet" href="/style-guide/css/fluig-style-guide-flat.min.css"/>


    <script type="text/javascript" src="/portal/resources/js/jquery/jquery.js"></script>


    <script type="text/javascript" src="/portal/resources/js/jquery/jquery-ui.min.js"></script>


    <script type="text/javascript" src="/style-guide/js/fluig-style-guide.min.js"></script>


</head>



<body>


    <div class="fluig-style-guide">


        <form name="form" role="form">



            <ul class="nav nav-tabs">


                <li class="active">


                    <a href="#dados" data-toggle="tab">

                        Dados da Solicitação

                    </a>


                </li>



                <li>


                    <a href="#aprovacao" data-toggle="tab">

                        Aprovação

                    </a>


                </li>



                <li>


                    <a href="#observacoes" data-toggle="tab">

                        Observações

                    </a>


                </li>


            </ul>





            <div class="tab-content">





                <div class="tab-pane active" id="dados">


                    <br>



                    <div class="form-group">


                        <label>

                            Nome do solicitante

                        </label>



                        <input


                            type="text"


                            class="form-control"


                            name="nomeSolicitante"


                            id="nomeSolicitante"


                            readonly>


                    </div>





                    <div class="form-group">


                        <label>

                            Data de Solicitação

                        </label>



                        <input


                            type="date"


                            class="form-control"


                            name="dataSolicitacao"


                            id="dataSolicitacao"


                            readonly>


                    </div>






                    <div class="form-group">


                        <label>

                            Tipo de solicitação

                        </label>



                        <select


                            class="form-control"


                            name="tipoSolicitacao">



                            <option value="">


                                Selecione


                            </option>



                            <option value="TI">


                                TI


                            </option>



                            <option value="RH">


                                RH


                            </option>



                            <option value="Financeiro">


                                Financeiro


                            </option>



                        </select>


                    </div>






                    <div class="form-group">


                        <label>

                            Descrição da solicitação

                        </label>



                        <textarea


                            class="form-control"


                            name="descricao"


                            rows="5"


                            placeholder="Descreva sua solicitação">


                        </textarea>


                    </div>




                </div>









                <div class="tab-pane" id="aprovacao">


                    <br>



                    <div class="form-group">


                        <label>

                            Responsável pela aprovação

                        </label>



                        <input


                            type="text"


                            class="form-control"


                            name="responsavelAprovacao">



                    </div>






                    <div class="form-group">


                        <label>

                            Status

                        </label>



                        <select


                            class="form-control"


                            name="status">



                            <option>

                                Pendente

                            </option>



                            <option>

                                Aprovado

                            </option>



                            <option>

                                Reprovado

                            </option>



                        </select>


                    </div>



                </div>









                <div class="tab-pane" id="observacoes">


                    <br>



                    <div class="form-group">


                        <label>

                            Observações adicionais

                        </label>



                        <textarea


                            class="form-control"


                            name="observacoes"


                            rows="5">



                        </textarea>


                    </div>



                </div>





            </div>



        </form>


    </div>





</body>


</html>
