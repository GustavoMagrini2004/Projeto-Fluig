<html>

<head>

    <link type="text/css" rel="stylesheet" href="/style-guide/css/fluig-style-guide-flat.min.css"/>

    <script type="text/javascript" src="/portal/resources/js/jquery/jquery.js"></script>

    <script type="text/javascript" src="/portal/resources/js/jquery/jquery-ui.min.js"></script>

    <script type="text/javascript" src="/style-guide/js/fluig-style-guide.min.js"></script>


    <style>

        .form-group {

            margin-bottom: 20px;

        }


        .tab-pane {

            padding: 20px;

        }


        .nav-tabs {

            margin-bottom: 15px;

        }


        label {

            margin-bottom: 8px;

        }


    </style>


</head>



<body>


<div class="fluig-style-guide">


<form name="form" role="form">



<ul class="nav nav-tabs" role="tablist">


<li class="active">

<a href="#dados" data-toggle="tab">

Dados da Solicitação

</a>

</li>



<li>

<a href="#aprovacao" data-toggle="tab">

Aprovação

</a>

</li>



<li>

<a href="#observacoes" data-toggle="tab">

Observações

</a>

</li>


</ul>





<div class="tab-content">





<!-- DADOS -->


<div class="tab-pane active" role="tabpanel" id="dados">



<div class="row">


<div class="col-md-6">


<div class="form-group">


<label>

Nome do solicitante

</label>


<input

type="text"

class="form-control"

name="nomeSolicitante"

id="nomeSolicitante"

readonly>

</div>


</div>





<div class="col-md-6">


<div class="form-group">


<label for="email">

E-mail

</label>


<input

type="email"

class="form-control"

id="email"

name="email">


</div>


</div>


</div>







<div class="row">


<div class="col-md-6">


<div class="form-group">


<label for="departamento">

Departamento

</label>


<input

type="text"

class="form-control"

id="departamento"

name="departamento">


</div>


</div>





<div class="col-md-6">


<div class="form-group">


<label for="tipoSolicitacao">

Tipo de solicitação

</label>



<select

class="form-control"

id="tipoSolicitacao"

name="tipoSolicitacao">



<option>

Selecione

</option>


<option>

Compra

</option>


<option>

Manutenção

</option>


<option>

Outro

</option>


</select>



</div>


</div>


</div>



</div>







<!-- APROVAÇÃO -->


<div class="tab-pane" role="tabpanel" id="aprovacao">



<div class="row">


<div class="col-md-6">


<div class="form-group">


<label for="aprovador">

Responsável pela aprovação

</label>


<input

type="text"

class="form-control"

id="aprovador"

name="aprovador">


</div>


</div>




<div class="col-md-6">


<div class="form-group">


<label for="status">

Status

</label>


<select

class="form-control"

id="status"

name="status">



<option>

Pendente

</option>


<option>

Aprovado

</option>


<option>

Reprovado

</option>


</select>



</div>


</div>



</div>



</div>









<!-- OBSERVAÇÕES -->


<div class="tab-pane" role="tabpanel" id="observacoes">



<div class="row">


<div class="col-md-12">


<div class="form-group">


<label for="observacoes">

Observações

</label>



<textarea

class="form-control"

id="observacoes"

name="observacoes"

rows="6">


</textarea>



</div>


</div>


</div>



</div>





</div>



</form>


</div>



</body>


</html>
